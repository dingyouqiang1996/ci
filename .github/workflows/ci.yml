name: Build and Test Docker Image

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-24.04-arm # 需要将仓库改为public后运行此job, 否则失败

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Docker Login
        run: |
          echo '${{ secrets.DOCKER_PULL_REGISTRY_SECRET }}' | docker login hkccr.ccs.tencentyun.com --username=${{ secrets.TX_TCR_UID }} --password-stdin
          # echo '${{ secrets.GUANGZHOU_CCR_PASSWORD }}' | docker login ccr.ccs.tencentyun.com --username=${{ secrets.GUANGZHOU_CCR_USERNAME }} --password-stdin
      - name: Build Docker image
        run: |
          docker build -t hkccr.ccs.tencentyun.com/rasp/ci:ansible ./ansible
          # docker build -t ccr.ccs.tencentyun.com/panfulu/rasp:python3.10 ./python
      - name: Push Docker image
        run: |
          docker push hkccr.ccs.tencentyun.com/rasp/ci:ansible
          # docker push ccr.ccs.tencentyun.com/panfulu/rasp:python3.10
