name: Build and Test Docker Image

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-24.04-arm # 需要将仓库改为public后运行此job, 否则失败

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Docker Login
        run: |
          # echo '${{ secrets.DOCKER_PULL_REGISTRY_SECRET }}' | docker login ccr.ccs.tencentyun.com --username=${{ secrets.guangzhou_ccr_password }} --password-stdin
          echo '${{ secrets.DOCKER_PULL_REGISTRY_SECRET }}' | docker login ccr.ccs.tencentyun.com --username=${{ secrets.guangzhou_ccr_password }} --password-stdin
      - name: Build Docker image
        run: |
          # docker build -t hkccr.ccs.tencentyun.com/rasp/ci:jumpserver-v1 ./jumpserver
          docker build -t ccr.ccs.tencentyun.com/panfulu/rasp:python3.10 ./python
      - name: Push Docker image
        run: |
          # docker push hkccr.ccs.tencentyun.com/rasp/ci:jumpserver-v1
          docker push ccr.ccs.tencentyun.com/panfulu/rasp:python3.10
