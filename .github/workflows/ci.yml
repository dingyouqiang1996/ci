name: Build and Test Docker Image

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    # runs-on: ubuntu-24.04
    runs-on: ubuntu-24.04-arm # 需要将仓库改为public后运行此job, 否则失败

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Docker Login
        run: |
          source env
          echo \
            '${{ secrets.DOCKER_PULL_REGISTRY_SECRET }}' | \
            docker login ${DOCKER_DOMAIN} \
            --username=${{ secrets.TX_TCR_UID }} \
            --password-stdin

      - name: Build Docker image
        run: |
          source env
          docker build -t ${DOCKER_FULL_PUSH_URL} ./${MY_FOLDER}

      - name: Push Docker image
        run: |
          source env
          docker push ${DOCKER_FULL_PUSH_URL}
